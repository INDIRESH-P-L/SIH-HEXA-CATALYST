# Local Postgres + pgvector — the zero-credential path.
# The Supabase path (see .env.example) needs no container; flip DB_URL/AUTH_MODE.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sip-db
    environment:
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: sip
      POSTGRES_DB: sip
    ports:
      - "5434:5432"          # 5434 on the host to avoid clashing with 5433 or local 5432
    volumes:
      - sip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip -d sip"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sip_pgdata:
